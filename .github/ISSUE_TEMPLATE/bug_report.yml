name: Bug report
description: Something in a kit does not work as its READ ME says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Issues are public: no place file, cookie, password, API key or personal information.
  - type: dropdown
    id: kit
    attributes:
      label: Kit name
      options:
        - Live Events Kit
        - Weather System Kit
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: The line that starts with "Version" near the top of the kit's READ ME.
      placeholder: Version 1.0.0, 2026-10-12
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - Studio
        - Published game
        - Both
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw instead, and the steps that lead to it.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Studio output
      description: The lines printed in the Output window when the problem occurs, copied as text. Lines from the kits start with "LiveEvents", "WeatherSystem" or "WeatherKit".
      render: text
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: Optional. The values you edited in the kit's settings, presets or admin list.
      render: lua
    validations:
      required: false
